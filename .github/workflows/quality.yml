name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Compile
        run: python -m compileall -q battery_soh_app.py core models ui utils
      - name: Lint
        run: ruff check .
      - name: Static security scan
        run: bandit -r core models ui utils battery_soh_app.py --ini .bandit
      - name: Dependency audit
        run: pip-audit -r requirements.lock
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Coverage gate
        shell: bash
        run: |
          coverage run --source=core,models,ui,utils -m unittest discover -s tests
          coverage report --fail-under=59
          coverage report --fail-under=85 --include="core/evaluate.py,core/result_semantics.py,core/run_snapshot.py,utils/config.py"
