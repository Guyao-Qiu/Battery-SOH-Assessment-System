[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["dataset", "outputs", ".idea"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"ui/tcp_server.py" = ["F821"]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/ui/tcp_server.py",
    "*/ui/tcp_display.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
