[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["dataset", "outputs", ".idea"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/ui/tcp_server.py",
    "*/ui/tcp_display.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
